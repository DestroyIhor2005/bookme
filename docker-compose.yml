services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  migrate:
    build: .
    restart: "no"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/House_Booking?retryWrites=true&w=majority
    command: ["npm", "run", "migrate"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/House_Booking?retryWrites=true&w=majority
    ports:
      - "3000:3000"

volumes:
  mongo-data: